resources:
  jobs:
    fraud_risk_lakehouse_pipeline:
      name: "Fraud Risk Lakehouse Pipeline"
      description: >-
        Rebuilds Bronze through Gold outputs, retrains models, and refreshes
        business-reporting tables from the five approved raw sources.
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 14400
      tags:
        project: fraud-risk-lakehouse
        layer: end-to-end
        managed_by: databricks_bundle
      environments:
        - environment_key: standard_v6
          spec:
            environment_version: "6"
      tasks:
        - task_key: environment_setup
          description: Confirm the configured Unity Catalog namespace and raw landing path.
          notebook_task:
            notebook_path: ../notebooks/00_environment_setup.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              volume_name: ${var.volume_name}
              raw_data_path: /Volumes/${var.catalog_name}/${var.schema_name}/${var.volume_name}/${var.raw_data_subdirectory}
              allow_create_catalog: "false"
              allow_create_schema: "false"
          environment_key: standard_v6

        - task_key: bronze_ingestion
          depends_on:
            - task_key: environment_setup
          description: Ingest the five approved raw source files into Bronze Delta tables.
          notebook_task:
            notebook_path: ../notebooks/bronze_ingestion.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              volume_name: ${var.volume_name}
              raw_data_path: /Volumes/${var.catalog_name}/${var.schema_name}/${var.volume_name}/${var.raw_data_subdirectory}
              storage_mode: ${var.bronze_storage_mode}
              write_mode: overwrite
              write_output: "true"
          environment_key: standard_v6

        - task_key: bronze_validation
          depends_on:
            - task_key: bronze_ingestion
          description: Validate Bronze schemas, source presence, keys, and relationship assumptions.
          notebook_task:
            notebook_path: ../notebooks/01_bronze_validation.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              volume_name: ${var.volume_name}
              raw_data_path: /Volumes/${var.catalog_name}/${var.schema_name}/${var.volume_name}/${var.raw_data_subdirectory}
              storage_mode: ${var.bronze_storage_mode}
          environment_key: standard_v6

        - task_key: raw_data_profiling
          depends_on:
            - task_key: bronze_validation
          description: Profile raw distributions and missingness for the pipeline run record.
          notebook_task:
            notebook_path: ../notebooks/02_raw_data_profiling.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              volume_name: ${var.volume_name}
              raw_data_path: /Volumes/${var.catalog_name}/${var.schema_name}/${var.volume_name}/${var.raw_data_subdirectory}
              storage_mode: ${var.bronze_storage_mode}
          environment_key: standard_v6

        - task_key: silver_pipeline
          depends_on:
            - task_key: raw_data_profiling
          description: Build cleaned dimensions and the enriched transaction fact.
          notebook_task:
            notebook_path: ../notebooks/03_silver_pipeline.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              silver_storage_mode: ${var.silver_storage_mode}
              silver_write_mode: overwrite
              write_output: "true"
          environment_key: standard_v6

        - task_key: feature_engineering
          depends_on:
            - task_key: silver_pipeline
          description: Create chronological splits and training-only MCC fraud-rate features.
          notebook_task:
            notebook_path: ../notebooks/04_feature_engineering.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              feature_storage_mode: unity_catalog
              feature_write_mode: overwrite
              write_output: "true"
          environment_key: standard_v6

        - task_key: model_training
          depends_on:
            - task_key: feature_engineering
          description: Train baseline and tree models, then evaluate selected validation thresholds.
          notebook_task:
            notebook_path: ../notebooks/05_model_training.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              model_storage_mode: ${var.model_storage_mode}
              model_write_mode: overwrite
              write_output: "true"
          environment_key: standard_v6

        - task_key: gold_risk_analytics
          depends_on:
            - task_key: model_training
          description: Select the validation champion and materialize risk KPIs plus investigation queue.
          notebook_task:
            notebook_path: ../notebooks/06_gold_risk_analytics.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              gold_storage_mode: ${var.gold_storage_mode}
              gold_write_mode: overwrite
              write_output: "true"
          environment_key: standard_v6

        - task_key: business_reporting
          depends_on:
            - task_key: gold_risk_analytics
          description: Produce dashboard-ready reporting and retrospective investigation views.
          notebook_task:
            notebook_path: ../notebooks/07_business_reporting.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
          environment_key: standard_v6
