resources:
  jobs:
    fraud_feature_experiments:
      name: "Fraud V2 - Rolling Feature Experiments"
      description: "Independent 2017/2018 validation; past-only history, delayed MCC labels and weight ablations. No test evaluation or promotion."
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 14400
      environments:
        - environment_key: standard_v6
          spec:
            environment_version: "6"
      tasks:
        - task_key: prepare
          notebook_task:
            notebook_path: ../notebooks/10_feature_experiments.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              mode: "prepare"
          environment_key: standard_v6
        - task_key: validate_2017
          depends_on:
            - task_key: prepare
          notebook_task:
            notebook_path: ../notebooks/10_feature_experiments.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              mode: "2017"
          environment_key: standard_v6
        - task_key: validate_2018
          depends_on:
            - task_key: validate_2017
          notebook_task:
            notebook_path: ../notebooks/10_feature_experiments.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              mode: "2018"
          environment_key: standard_v6
        - task_key: summarize
          depends_on:
            - task_key: validate_2018
          notebook_task:
            notebook_path: ../notebooks/10_feature_experiments.py
            base_parameters:
              project_root: ${workspace.file_path}
              config_path: ${workspace.file_path}/config/project_config.yml
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              mode: "summarize"
          environment_key: standard_v6
