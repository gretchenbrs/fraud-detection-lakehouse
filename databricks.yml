bundle:
  name: fraud-risk-lakehouse

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse used by the AI/BI dashboard
    default: "7bd8a109f691d393"
  catalog_name:
    description: Unity Catalog catalog for the fraud lakehouse
    default: "workspace"
  schema_name:
    description: Unity Catalog schema for the fraud lakehouse
    default: "fraud_detection"
  volume_name:
    description: Unity Catalog Volume that stores the uploaded raw files
    default: "fraud_detection_raw"
  raw_data_subdirectory:
    description: Folder inside the volume containing the five raw source files
    default: ""
  bronze_storage_mode:
    description: Bronze write mode target, either unity_catalog or path
    default: "unity_catalog"
  bronze_base_path:
    description: Base Delta path used only when bronze_storage_mode=path
    default: "dbfs:/tmp/fraud-risk-lakehouse/bronze"
  silver_storage_mode:
    description: Silver write target, either unity_catalog or path
    default: "unity_catalog"
  silver_base_path:
    description: Base Delta path used only when silver_storage_mode=path
    default: "dbfs:/tmp/fraud-risk-lakehouse/silver"
  model_storage_mode:
    description: Model-output write target, either unity_catalog or path
    default: "unity_catalog"
  model_base_path:
    description: Base Delta path used only when model_storage_mode=path
    default: "dbfs:/tmp/fraud-risk-lakehouse/models"
  gold_storage_mode:
    description: Gold-output write target, either unity_catalog or path
    default: "unity_catalog"
  gold_base_path:
    description: Base Delta path used only when gold_storage_mode=path
    default: "dbfs:/tmp/fraud-risk-lakehouse/gold"

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-c80fffcf-363a.cloud.databricks.com
