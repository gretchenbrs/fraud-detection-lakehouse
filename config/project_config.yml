project:
  name: fraud-risk-lakehouse
  layer: silver
  owner: gretchen

databricks:
  catalog_name: workspace
  schema_name: fraud_detection
  volume_name: fraud_detection_raw
  raw_data_subdirectory: ""
  raw_data_path: "/Volumes/workspace/fraud_detection/fraud_detection_raw"
  create_catalog_if_missing: false
  create_schema_if_missing: false

bronze:
  storage_mode: unity_catalog
  write_format: delta
  write_mode: overwrite
  table_names:
    transactions: bronze_transactions
    users: bronze_users
    cards: bronze_cards
    fraud_labels: bronze_fraud_labels
    mcc_codes: bronze_mcc_codes
  base_path: dbfs:/tmp/fraud-risk-lakehouse/bronze
  table_path_overrides: {}

silver:
  storage_mode: unity_catalog
  write_format: delta
  write_mode: overwrite
  table_names:
    users: silver_users
    cards: silver_cards
    fraud_labels: silver_fraud_labels
    mcc_codes: silver_mcc_codes
    transactions: silver_transactions
  base_path: dbfs:/tmp/fraud-risk-lakehouse/silver
  table_path_overrides: {}
  night_start_hour: 0
  night_end_hour: 6

raw_sources:
  expected_files:
    transactions: transactions_data.csv
    users: users_data.csv
    cards: cards_data.csv
    fraud_labels: train_fraud_labels.json
    mcc_codes: mcc_codes.json

runtime:
  notes:
    - Default catalog, schema, volume, and raw_data_path match the current project workspace.
    - Unity Catalog managed tables are preferred when the workspace supports them.
    - Set bronze.storage_mode to path to write Delta files under bronze.base_path instead of managed tables.
    - Bronze and Silver use overwrite for reproducible portfolio runs; production pipelines should use incremental writes.
