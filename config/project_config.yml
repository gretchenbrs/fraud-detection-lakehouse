project:
  name: fraud-risk-lakehouse
  layer: models
  owner: gretchen

databricks:
  catalog_name: workspace
  schema_name: fraud_detection
  volume_name: fraud_detection_raw
  raw_data_subdirectory: ""
  raw_data_path: "/Volumes/workspace/fraud_detection/fraud_detection_raw"
  create_catalog_if_missing: false
  create_schema_if_missing: false

bronze:
  storage_mode: unity_catalog
  write_format: delta
  write_mode: overwrite
  table_names:
    transactions: bronze_transactions
    users: bronze_users
    cards: bronze_cards
    fraud_labels: bronze_fraud_labels
    mcc_codes: bronze_mcc_codes
  base_path: dbfs:/tmp/fraud-risk-lakehouse/bronze
  table_path_overrides: {}

silver:
  storage_mode: unity_catalog
  write_format: delta
  write_mode: overwrite
  table_names:
    users: silver_users
    cards: silver_cards
    fraud_labels: silver_fraud_labels
    mcc_codes: silver_mcc_codes
    transactions: silver_transactions
  base_path: dbfs:/tmp/fraud-risk-lakehouse/silver
  table_path_overrides: {}
  night_start_hour: 0
  night_end_hour: 6

features:
  storage_mode: unity_catalog
  write_format: delta
  write_mode: overwrite
  table_names:
    split_assignments: feature_split_assignments
    mcc_fraud_rates: feature_mcc_fraud_rates
    model_features: feature_model_features
  base_path: dbfs:/tmp/fraud-risk-lakehouse/features
  table_path_overrides: {}
  train_end_date: "2017-12-31"
  validation_end_date: "2018-12-31"
  mcc_smoothing_alpha: 100.0

models:
  storage_mode: unity_catalog
  write_format: delta
  write_mode: overwrite
  table_names:
    scored_predictions: model_scored_predictions
    overall_metrics: model_overall_metrics
    threshold_metrics: model_threshold_metrics
    top_k_metrics: model_top_k_metrics
  base_path: dbfs:/tmp/fraud-risk-lakehouse/models
  table_path_overrides: {}
  seed: 42
  use_class_weights: true
  thresholds:
    - 0.001
    - 0.002
    - 0.005
    - 0.01
    - 0.02
    - 0.05
    - 0.10
    - 0.20
    - 0.30
    - 0.40
    - 0.50
    - 0.60
    - 0.70
    - 0.80
    - 0.90
    - 0.95
    - 0.98
    - 0.99
  top_k_fractions: [0.001, 0.005, 0.01, 0.02, 0.05]
  logistic_regression:
    max_iter: 40
    reg_param: 0.05
    elastic_net_param: 0.0
  random_forest:
    num_trees: 40
    max_depth: 8
    max_bins: 128
    subsampling_rate: 0.7

raw_sources:
  expected_files:
    transactions: transactions_data.csv
    users: users_data.csv
    cards: cards_data.csv
    fraud_labels: train_fraud_labels.json
    mcc_codes: mcc_codes.json

runtime:
  notes:
    - Default catalog, schema, volume, and raw_data_path match the current project workspace.
    - Unity Catalog managed tables are preferred when the workspace supports them.
    - Set bronze.storage_mode to path to write Delta files under bronze.base_path instead of managed tables.
    - Bronze and Silver use overwrite for reproducible portfolio runs; production pipelines should use incremental writes.
    - Feature splits are chronological and MCC fraud rates are fitted from training rows only.
    - Model preprocessing and class weights are fitted on training rows only.
    - Thresholds are compared on validation data; the test split is reserved for final evaluation.
